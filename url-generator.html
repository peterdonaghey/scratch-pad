<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Pad URL Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;max-width:800px;margin:0 auto;color:#333}
h1{font-size:20px;margin-bottom:4px}
p{color:#888;font-size:13px;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:4px}
textarea{width:100%;min-height:200px;padding:12px;font-family:'SF Mono','Courier New',monospace;font-size:13px;border:1px solid #ccc;border-radius:6px;resize:vertical}
input[type=text]{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px}
.row{display:flex;gap:8px;margin:12px 0}
.row button,.row input{flex:1}
button{padding:8px 16px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;font-weight:500}
button:hover{background:#f0f0f0}
.result{margin-top:16px}
.result code{display:block;padding:12px;background:#f5f5f5;border-radius:6px;font-size:12px;word-break:break-all;border:1px solid #eee;user-select:all}
</style>
</head>
<body>
<h1>🔗 Scratch Pad URL Generator</h1>
<p>Paste your markdown and get a shareable URL.</p>

<label for="name">Sheet name (optional)</label>
<input type="text" id="name" placeholder="e.g. notes, recipes, draft">

<label for="md" style="margin-top:12px">Markdown content</label>
<textarea id="md" placeholder="Paste your markdown here…"></textarea>

<div class="row">
  <button id="genBtn">Generate URL</button>
  <button id="copyBtn">Copy URL</button>
</div>

<div class="result">
  <code id="output">URL will appear here</code>
</div>

<script>
const BASE = 'https://scratch-pad-beryl.vercel.app'
const nameEl = document.getElementById('name')
const mdEl = document.getElementById('md')
const output = document.getElementById('output')
const genBtn = document.getElementById('genBtn')
const copyBtn = document.getElementById('copyBtn')

function generate() {
  const name = nameEl.value.trim()
  const md = mdEl.value
  if (!md.trim()) { output.textContent = 'Enter some markdown first'; return }
  const url = new URL(BASE + (name ? '/' + encodeURIComponent(name) : '/'))
  url.searchParams.set('md', md)
  output.textContent = url.toString()
}

genBtn.addEventListener('click', generate)
copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(output.textContent).catch(() => {})
  copyBtn.textContent = '✅ Copied!'
  setTimeout(() => { copyBtn.textContent = 'Copy URL' }, 1500)
})

// Auto-generate on paste
mdEl.addEventListener('paste', () => setTimeout(generate, 50))
nameEl.addEventListener('input', generate)
</script>
</body>
</html>
